<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CO2 planning</title>
  <script src="codebase/dhtmlxgantt.js"></script>
  <link href="codebase/dhtmlxgantt.css" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #gantt_here {
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      font-size: 18px;
    }
    .gantt-btn {
      position: absolute;
      z-index: 10;
      bottom: 20px;
      left: 20px;
      padding: 8px 18px;
      background: #ffffff;
      border: 1px solid #d4d4d4;
      border-radius: 4px;
      color: #444;
      font-family: Arial;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      transition: background 0.2s, border 0.2s;
    }
    .gantt-btn:hover {
      background: #e9e9e9;
      border-color: #bcbcbc;
    }
    .gantt_task_line {
      background-color: #FF0000 !important;
      border: 1px solid #b30000 !important;
    }
    .gantt_task_line.child-task {
      background-color: #007480 !important;
      border: 1px solid #0288d1 !important;
    }
    .gantt_task_line.specs-task,
    .gantt_task_line.specs-task.child-task {
      background-color: #daba07 !important;
      border: 1px solid #DAA520 !important;
    }
    .gantt_tree_cell, .gantt_grid_row .gantt_cell {
      font-size: 20px;
      line-height: 60px;
    }
    .gantt_task_row { height: 60px !important; }
    .gantt_task_content, .gantt_task_text {
      font-size: 16px;
      line-height: 30px;
    }
    .gantt_marker_line.today {
      background-color: #e53935 !important;
      width: 2px !important;
      z-index: 9999 !important;
    }
    .gantt_marker_text.today {
      color: #e53935 !important;
      font-weight: 600;
      z-index: 9999 !important;
    }
    .gantt_side_content {
      font-size: 40px !important;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="gantt_here"></div>
  <script type="text/javascript">
    // Gantt config
    gantt.plugins({ marker: true });
    gantt.config.xml_date = "%Y-%m-%d %H:%i";

    // Task class template
    gantt.templates.task_class = function(start, end, task) {
      const classes = [];
      if (task.isSpec) classes.push("specs-task");
      if (task.parent && task.parent != 0) classes.push("child-task");
      return classes.join(" ");
    };

    // Task text template
    gantt.templates.task_text = function(start, end, task) {
      return task.text;
    };

    // Lightbox sections
    gantt.config.lightbox.sections = [
      { name: "name", height: 30, map_to: "text", type: "textarea", focus: true },
      { name: "description", height: 70, map_to: "description", type: "textarea", focus: true },
      // Removed status section
      { name: "time", type: "duration", map_to: "auto" }
    ];

    // Scale config
    gantt.config.scale_unit = "week";
    gantt.templates.date_scale = function(date) {
      const end = new Date(date);
      end.setDate(end.getDate() + 6);
      return pad(date.getDate()) + '.' + pad(date.getMonth() + 1) + ' to ' + pad(end.getDate()) + '.' + pad(end.getMonth() + 1);
    };
    gantt.config.subscales = [{ unit: "month", step: 1, date: "%F %Y" }];
    gantt.config.scale_height = 80;
    gantt.config.min_column_width = 140;

    // Columns
    gantt.config.columns = [
      { name: "text", label: "name", width: "*", tree: true },
      { name: "duration_weeks", label: "Durée (semaines)", align: "center", width: 120, template: obj => Math.round((obj.duration || 0) / 7) },
      { name: "add", label: "", width: 44 }
    ];

    // Other configs
    gantt.config.order_branch = true;
    gantt.config.order_branch_free = true;
    gantt.config.row_height = 60;
    gantt.config.bar_height = 30;

    // Helper functions
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    function formatGanttDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' 00:00'; }
    function toDateFromDDMM(ddmm, year) {
      const parts = ddmm.split('.').map(x => parseInt(x, 10));
      return new Date(year, parts[1] - 1, parts[0], 0, 0, 0);
    }
    function daysInclusive(start, end) {
      const ms = 24 * 60 * 60 * 1000;
      return Math.round((end - start) / ms) + 1;
    }

    const RE = {
      header: /⚡?\s*(S?\d+)?\s*([0-3]?\d\.\d{1,2})\s*-\s*([0-3]?\d\.\d{1,2})/i,
      bullet: /^\s*-\s+(.+)$/,
      specInline: /^\s*\[?\s*Specs\s*\]?\s*[:\-–]?\s*(.*)$/i,
      specLine: /^\s*(?:\[(?:Specs)\]|\bSpecs\b)\s*[:\-–]?\s*(.+)?$/i,
      plus: /^\[?\s*\+(\d+)\s*\]?$/
    };

    function buildSprintRanges(sections, baseYear) {
      let year = baseYear || new Date().getFullYear();
      let prevStartMonth = null;
      const ranges = [];
      sections.forEach((section, idx) => {
        const headerLine = (section.split('\n')[0] || '').trim();
        const headerMatch = headerLine.match(RE.header);
        if (!headerMatch) { ranges.push(null); return; }
        const [_, sprintLabel, startDDMM, endDDMM] = headerMatch;
        const startMonth = parseInt(startDDMM.split('.')[1], 10);
        if (prevStartMonth !== null && startMonth < prevStartMonth) year++;
        prevStartMonth = startMonth;
        const startDateObj = toDateFromDDMM(startDDMM, year);
        let endYear = year;
        const endMonth = parseInt(endDDMM.split('.')[1], 10);
        if (endMonth < startMonth) endYear++;
        const endDateObj = toDateFromDDMM(endDDMM, endYear);
        const duration = daysInclusive(startDateObj, endDateObj);
        const labelNumber = String(sprintLabel || idx + 1).replace(/^S/i, '').trim() || String(idx + 1);
        ranges.push({ startDateObj, endDateObj, duration, labelNumber });
      });
      return ranges;
    }

    // Parse markdown to gantt data
    function parseMarkdownToGanttData(markdown, baseYear) {
      markdown = String(markdown).replace(/\u00A0/g, ' ').replace(/[–—]/g, '-').replace(/\r\n/g, '\n');

      const sections = markdown.split(/^###\s*/m).slice(1);
      const data = [], links = [];
      let linkId = 1;
      const sprintRanges = buildSprintRanges(sections, baseYear);

      const computeDuration = (startDateObj, baseDuration, extra, idx) => {
        if (extra > 0 && sprintRanges[idx + extra]) {
          return daysInclusive(startDateObj, sprintRanges[idx + extra].endDateObj);
        }
        return extra > 0 ? baseDuration * (1 + extra) : baseDuration;
      };

      sections.forEach((section, idx) => {
        const range = sprintRanges[idx];
        if (!range) return;

        const sprintId = idx + 1;
        const { startDateObj, duration, labelNumber } = range;
        data.push({
          id: sprintId,
          text: `Sprint ${labelNumber}`,
          start_date: formatGanttDate(startDateObj),
          duration,
          progress: 0
        });

        const lines = section.split('\n');
        let taskIndex = 0;
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i];
          const topMatch = line.match(RE.bullet);
          if (!topMatch) continue;

          taskIndex++;
          let title = topMatch[1].trim();
          let isSpecTask = false;
          const tSpec = title.match(RE.specInline);
          if (tSpec) {
            isSpecTask = true;
            const body = (tSpec[1] || '').trim();
            title = '(Specs) ' + (body || 'Specs');
          }

          let descLines = [], j = i + 1;
          let extraSprintsFromDesc = 0;
          while (j < lines.length && (lines[j].match(/^\s{2,}.+/) || lines[j].trim() === '')) {
            const descMatch = lines[j].match(/^\s{2,}(.+)/);
            if (descMatch) {
              const descLine = descMatch[1];
              const plusLineMatch = descLine.match(RE.plus);
              if (plusLineMatch) extraSprintsFromDesc = parseInt(plusLineMatch[1], 10) || 0;
              else descLines.push(descLine);
            }
            j++;
          }
          i = j - 1;

          let extraSprints = 0;
          const plusMatch = title.match(/\[\s*\+(\d+)\s*\]/);
          if (plusMatch) {
            extraSprints = parseInt(plusMatch[1], 10) || 0;
            title = title.replace(plusMatch[0], '').trim();
          }
          if (extraSprintsFromDesc > 0) extraSprints = Math.max(extraSprints, extraSprintsFromDesc);

          const taskId = sprintId * 100 + taskIndex;
          data.push({
            id: taskId,
            text: title,
            parent: sprintId,
            start_date: formatGanttDate(startDateObj),
            duration: computeDuration(startDateObj, duration, extraSprints, idx),
            description: descLines.join('\n').trim(),
            isSpec: isSpecTask
          });
          links.push({ id: linkId++, source: sprintId, target: taskId, type: "1" });
        }

        for (let si = 1; si < lines.length; si++) {
          const specLineMatch = lines[si].match(RE.specLine);
          if (!specLineMatch) continue;

          let body = (specLineMatch[1] && specLineMatch[1].trim()) ? specLineMatch[1].trim() : 'Specs';
          let extraSprintsSpec = 0;
          for (let m = si + 1; m < Math.min(lines.length, si + 5); m++) {
            const plusLineMatch = lines[m].match(RE.plus);
            if (plusLineMatch) { extraSprintsSpec = parseInt(plusLineMatch[1], 10) || 0; break; }
          }

          const displayText = '(Specs) ' + (body || 'Specs');
          const exists = data.some(d => d.parent === sprintId && d.text === displayText);
          if (!exists) {
            taskIndex++;
            const taskId = sprintId * 100 + taskIndex;
            data.push({
              id: taskId,
              text: displayText,
              parent: sprintId,
              start_date: formatGanttDate(startDateObj),
              duration: computeDuration(startDateObj, duration, extraSprintsSpec, idx),
              isSpec: true
            });
            links.push({ id: linkId++, source: sprintId, target: taskId, type: "1" });
          }
        }
      });

      return { data, links };
    }

    gantt.init("gantt_here");

    function addTodayMarker(date) {
      if (window._todayMarkerId) try { gantt.removeMarker(window._todayMarkerId); } catch (e) {}
      const dateToStr = gantt.date.date_to_str(gantt.config.task_date);
      window._todayMarkerId = gantt.addMarker({
        start_date: date instanceof Date ? date : new Date(date),
        css: "today",
        text: "Today",
        title: dateToStr(new Date(date))
      });
      gantt.render();
    }

    fetch('./Project_backlog.md')
      .then(response => response.ok ? response.text() : Promise.reject('fetch failed: ' + response.status))
      .then(markdown => {
        const ganttData = parseMarkdownToGanttData(markdown, 2025);
        gantt.clearAll();
        gantt.parse(ganttData);
        addTodayMarker(new Date());

        // Center on current sprint containing today
        const today = new Date();
        const currentSprint = ganttData.data.find(task => 
          task.parent === 0 && // sprint tasks have parent 0
          new Date(task.start_date) <= today &&
          new Date(task.start_date).getTime() + (task.duration * 24 * 60 * 60 * 1000) >= today.getTime()
        );
        if (currentSprint) {
          gantt.showDate(new Date(currentSprint.start_date));
        } else {
          gantt.showDate(today); // fallback to today if no sprint found
        }
      })
      .catch(error => console.error('Error loading markdown:', error));

    window.addEventListener("resize", () => gantt.setSizes());

    function toggleGrid() {
      gantt.config.show_grid = !gantt.config.show_grid;
      gantt.render();

    }  </script>
  <button class="gantt-btn" onclick="toggleGrid()">Afficher/Masquer la grille</button>
</body>
</html>
